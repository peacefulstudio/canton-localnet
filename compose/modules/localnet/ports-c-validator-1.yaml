      - "${HOST_BIND_IP:-127.0.0.1}:${TEST_PORT-13$PARTICIPANT_LEDGER_API_PORT_SUFFIX}:13${PARTICIPANT_LEDGER_API_PORT_SUFFIX}"
      - "${HOST_BIND_IP:-127.0.0.1}:${TEST_PORT-13$PARTICIPANT_ADMIN_API_PORT_SUFFIX}:13${PARTICIPANT_ADMIN_API_PORT_SUFFIX}"
      - "${HOST_BIND_IP:-127.0.0.1}:${TEST_PORT-13$PARTICIPANT_JSON_API_PORT_SUFFIX}:13${PARTICIPANT_JSON_API_PORT_SUFFIX}"

  splice:
