services:
  canton:
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${TEST_PORT-11$PARTICIPANT_LEDGER_API_PORT_SUFFIX}:11${PARTICIPANT_LEDGER_API_PORT_SUFFIX}"
      - "${HOST_BIND_IP:-127.0.0.1}:${TEST_PORT-11$PARTICIPANT_ADMIN_API_PORT_SUFFIX}:11${PARTICIPANT_ADMIN_API_PORT_SUFFIX}"
      - "${HOST_BIND_IP:-127.0.0.1}:${TEST_PORT-11$PARTICIPANT_JSON_API_PORT_SUFFIX}:11${PARTICIPANT_JSON_API_PORT_SUFFIX}"

  splice:
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${TEST_PORT-11$VALIDATOR_ADMIN_API_PORT_SUFFIX}:11${VALIDATOR_ADMIN_API_PORT_SUFFIX}"

  nginx:
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${A_VALIDATOR_1_UI_PORT}:${A_VALIDATOR_1_UI_PORT}"
