      - "${HOST_BIND_IP:-127.0.0.1}:${TEST_PORT-10$VALIDATOR_ADMIN_API_PORT_SUFFIX}:10${VALIDATOR_ADMIN_API_PORT_SUFFIX}"

  nginx:
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${SV_VALIDATOR_1_UI_PORT}:${SV_VALIDATOR_1_UI_PORT}"
