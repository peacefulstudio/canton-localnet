canton.validator-apps.c-validator-1-backend {
  participant-client.ledger-api.auth-config = {
    type = "client-credentials"
    well-known-config-url = ${AUTH_C_VALIDATOR_1_WELLKNOWN_URL}
    client-id = ${AUTH_C_VALIDATOR_1_VALIDATOR_CLIENT_ID}
    client-secret = ${AUTH_C_VALIDATOR_1_VALIDATOR_CLIENT_SECRET}
    audience = ${AUTH_C_VALIDATOR_1_AUDIENCE}
  }

  auth {
    algorithm = "rs-256"
    audience = ${AUTH_C_VALIDATOR_1_AUDIENCE}
    jwks-url = ${AUTH_C_VALIDATOR_1_JWK_SET_URL}
  }

  ledger-api-user = ${AUTH_C_VALIDATOR_1_VALIDATOR_USER_ID}
  validator-wallet-users.0 = ${AUTH_C_VALIDATOR_1_WALLET_ADMIN_USER_ID}
}