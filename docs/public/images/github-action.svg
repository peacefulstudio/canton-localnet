<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1040" viewBox="0 0 880 1040" role="img" aria-labelledby="title desc">
<title id="title">Canton LocalNet in a GitHub Actions job</title>
<desc id="desc">One GitHub Actions job on a Linux runner with Docker. The boot step resolves the canton-localnet CLI, cleans up any leftover localnet compose project, runs docker compose up with one retry, waits until every slot is ready, and writes every endpoint and credential to GITHUB_ENV with secrets masked. Your test steps read the CANTON_LOCALNET slot variables, get a token from the slot's Keycloak realm with a client_credentials grant, and call the slot's JSON or gRPC Ledger API. The teardown step runs even when tests fail, runs down with volumes, and on failure uploads a diagnostics artifact and exits non-zero. In Docker run the Super Validator, Scan and the token-standard registry behind nginx, Keycloak, validator slot a, and optionally slots b to d, PQS and observability, all on 127.0.0.1 only.</desc>
<style>
