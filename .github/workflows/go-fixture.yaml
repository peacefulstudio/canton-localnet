name: go-fixture

on:
  push:
    branches: [dev]
    paths:
      - 'go/fixture/**'
      - 'compose/**'
      - 'Makefile'
      - '.github/workflows/go-fixture.yaml'
  pull_request:
    branches: [dev]
    paths:
      - 'go/fixture/**'
      - 'compose/**'
      - 'Makefile'
      - '.github/workflows/go-fixture.yaml'

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.23'
          # go/fixture has no external dependencies (stdlib only) and therefore
          # no go.sum; actions/setup-go's cache requires go.sum to compute a
          # key, so caching is disabled here.
          cache: false

      - name: go vet
        working-directory: go/fixture
        run: |
          set -euo pipefail
          go vet ./...

      - name: go test
        working-directory: go/fixture
        run: |
          set -euo pipefail
          go test -race -count=1 ./...

  integration:
    name: integration (compose smoke)
    runs-on: ubuntu-latest
    needs: unit
    env:
      AUTH_MODE: oauth2
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.23'
          # go/fixture has no external dependencies (stdlib only) and therefore
          # no go.sum; actions/setup-go's cache requires go.sum to compute a
          # key, so caching is disabled here.
          cache: false

      - name: Show docker / compose versions
        run: |
          set -euo pipefail
          docker version
          docker compose version

      - name: Bring up LocalNet
        run: |
          set -euo pipefail
          make up

      - name: Wait for JSON Ledger API readiness
        env:
          ATTEMPTS: "120"
          SLEEP_SECONDS: "5"
        run: |
          set -euo pipefail
          make wait-ready

      - name: Run integration smoke test
        working-directory: go/fixture
        run: |
          set -euo pipefail
          go test -tags integration -count=1 -v ./...

      - name: Capture compose state on failure
        if: failure()
        run: |
          set -euo pipefail
          make status > /tmp/compose-status.txt 2>&1 || true
          timeout 30 make logs > /tmp/compose-logs.txt 2>&1 || true

      - name: Upload compose diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: compose-diagnostics
          path: |
            /tmp/compose-status.txt
            /tmp/compose-logs.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down
        if: always()
        run: make down
