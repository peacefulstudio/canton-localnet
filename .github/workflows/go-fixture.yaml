name: go-fixture

on:
  push:
    branches: [dev]
    paths:
      - 'go/fixture/**'
      - '.github/workflows/go-fixture.yaml'
  pull_request:
    branches: [dev]
    paths:
      - 'go/fixture/**'
      - '.github/workflows/go-fixture.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26'
          # go/fixture has no external dependencies (stdlib only) and therefore
          # no go.sum; actions/setup-go's cache requires go.sum to compute a
          # key, so caching is disabled here.
          cache: false

      - name: go vet
        working-directory: go/fixture
        run: |
          set -euo pipefail
          go vet ./...

      - name: go test
        working-directory: go/fixture
        run: |
          set -euo pipefail
          go test -race -count=1 ./...
