name: go-fixture

on:
  push:
    branches: [dev]
    paths:
      - 'go/fixture/**'
      - '.github/workflows/go-fixture.yaml'
  pull_request:
    branches: [dev]
    paths:
      - 'go/fixture/**'
      - '.github/workflows/go-fixture.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: go/fixture/go.sum

      - name: go vet
        working-directory: go/fixture
        run: |
          set -euo pipefail
          go vet ./...

      - name: go test
        working-directory: go/fixture
        run: |
          set -euo pipefail
          go test -race -count=1 ./...

  floor:
    name: floor (go.mod minimum)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/fixture/go.mod
          cache-dependency-path: go/fixture/go.sum

      - name: go vet
        working-directory: go/fixture
        run: |
          set -euo pipefail
          go vet ./...

      - name: go test
        working-directory: go/fixture
        run: |
          set -euo pipefail
          go test -race -count=1 ./...
