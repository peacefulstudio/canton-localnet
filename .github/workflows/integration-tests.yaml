name: integration-tests

on:
  push:
    branches: [dev]
    paths:
      - 'compose/**'
      - 'Makefile'
      - 'cli/**'
      - 'tests/acceptance/**'
      - '!**/*.md'
      - '.github/workflows/integration-tests.yaml'
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [dev]
    paths:
      - 'compose/**'
      - 'Makefile'
      - 'cli/**'
      - 'tests/acceptance/**'
      - '!**/*.md'
      - '.github/workflows/integration-tests.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' && github.event.action != 'unlabeled' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  setup:
    name: select scenarios
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'ci:full'
    outputs:
      scenarios: ${{ steps.select.outputs.scenarios }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Detect changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: |
            observability:
              - 'compose/modules/observability/**'
            cli-config:
              - 'cli/**'
              - 'compose/**'
              - '!compose/modules/observability/**'
              - 'Makefile'

      - name: Select scenarios
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          HAS_FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          OBSERVABILITY_CHANGED: ${{ steps.filter.outputs.observability }}
          CLI_CONFIG_CHANGED: ${{ steps.filter.outputs.cli-config }}
        run: |
          set -euo pipefail
          scenarios=()
          if [ "${EVENT_NAME}" != "pull_request" ] || [ "${HAS_FULL_LABEL}" = "true" ]; then
            scenarios=(5-healthy-validators 3-healthy-validators warm-restart observability-on observability-off)
          else
            scenarios+=(5-healthy-validators)
            if [ "${CLI_CONFIG_CHANGED}" = "true" ]; then
              scenarios+=(3-healthy-validators warm-restart)
            fi
            if [ "${OBSERVABILITY_CHANGED}" = "true" ]; then
              scenarios+=(observability-on observability-off)
            fi
          fi
          json=$(printf '%s\n' "${scenarios[@]}" | jq -R . | jq -cs .)
          echo "scenarios=${json}" >> "${GITHUB_OUTPUT}"
          echo "Selected scenarios: ${json}"
          echo "Selected scenarios: ${json}" >> "${GITHUB_STEP_SUMMARY}"

  scenario:
    name: ${{ matrix.scenario }}
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.setup.outputs.scenarios) }}
    env:
      AUTH_MODE: oauth2
      SCENARIO: ${{ matrix.scenario }}
      OBS: ${{ (matrix.scenario == 'observability-on') && 'on' || 'off' }}
      IS_OBS: ${{ startsWith(matrix.scenario, 'observability-') }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26'
          cache-dependency-path: cli/go.sum

      - name: Show docker / compose versions
        run: |
          set -euo pipefail
          docker version
          docker compose version

      - name: Build canton-localnet binary
        working-directory: cli
        run: |
          set -euo pipefail
          go build -o "${GITHUB_WORKSPACE}/canton-localnet" ./cmd/canton-localnet

      - name: Write canton-localnet.yaml (3-healthy-validators)
        if: matrix.scenario == '3-healthy-validators'
        run: |
          set -euo pipefail
          cat > canton-localnet.yaml <<'EOF'
          schemaVersion: preview-1
          validators:
            c-validator-1:
              enabled: false
            d-validator-1:
              enabled: false
          EOF
          cat canton-localnet.yaml

      - name: Bring up LocalNet via CLI (one retry on splice bootstrap race)
        if: env.IS_OBS == 'false'
        run: |
          set -euo pipefail
          # Splice's SV-validator can lose a startup race on slower runners
          # — "Ensuring decentralized synchronizer registered failed:
          # UNAVAILABLE: No active synchronizer serial found". The initial
          # bring-up is treated as setup, so one retry is allowed; the
          # warm-restart step below stays single-shot because that IS the
          # regression-test signal.
          if ! "${GITHUB_WORKSPACE}/canton-localnet" up; then
            echo "::warning::canton-localnet up failed on first attempt — capturing diagnostics, tearing down with volumes, and retrying once"
            docker ps -a > docker-ps-attempt1.txt 2>&1 || true
            timeout 60 make logs > logs-attempt1.txt 2>&1 || true
            "${GITHUB_WORKSPACE}/canton-localnet" down --volumes || echo "::warning::pre-retry teardown failed; second up may fail with leaked state"
            sleep 30
            "${GITHUB_WORKSPACE}/canton-localnet" up
          fi

      - name: Bring up LocalNet via make (one retry on splice bootstrap race)
        if: env.IS_OBS == 'true'
        run: |
          set -euo pipefail
          # Splice's SV-validator can lose a startup race on slower runners
          # — "Ensuring decentralized synchronizer registered failed:
          # UNAVAILABLE: No active synchronizer serial found". The initial
          # bring-up is treated as setup, so one retry is allowed.
          if ! make up; then
            echo "::warning::make up failed on first attempt — capturing diagnostics, tearing down with volumes, and retrying once"
            docker ps -a > docker-ps-attempt1.txt 2>&1 || true
            timeout 60 make logs > logs-attempt1.txt 2>&1 || true
            make clean || echo "::warning::pre-retry teardown failed; second up may fail with leaked state"
            sleep 30
            make up
          fi

      - name: Wait for expected validators (CLI scenarios)
        if: env.IS_OBS == 'false'
        env:
          PER_VALIDATOR_TIMEOUT: 600
          POLL_INTERVAL: 5
        run: |
          set -euo pipefail

          case "${SCENARIO}" in
            3-healthy-validators)
              SLOTS="sv-validator-1 a-validator-1 b-validator-1"
              ;;
            *)
              SLOTS="sv-validator-1 a-validator-1 b-validator-1 c-validator-1 d-validator-1"
              ;;
          esac

          declare -A PREFIX
          PREFIX[sv-validator-1]=10
          PREFIX[a-validator-1]=11
          PREFIX[b-validator-1]=12
          PREFIX[c-validator-1]=13
          PREFIX[d-validator-1]=14

          for slot in $SLOTS; do
            prefix="${PREFIX[$slot]}"
            url="http://localhost:${prefix}975/readyz"
            echo "::group::Wait for ${slot} (${url})"
            "${GITHUB_WORKSPACE}/canton-localnet" wait-ready \
              --url "${url}" \
              --timeout "${PER_VALIDATOR_TIMEOUT}s" \
              --interval "${POLL_INTERVAL}s"
            echo "::endgroup::"
          done

      - name: Wait for JSON Ledger API readiness (observability scenarios)
        if: env.IS_OBS == 'true'
        env:
          ATTEMPTS: "120"
          SLEEP_SECONDS: "5"
        run: |
          set -euo pipefail
          make wait-ready

      - name: Wait for Grafana (observability-on)
        if: matrix.scenario == 'observability-on'
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3030/api/health > /dev/null; then
              echo "Grafana healthy"
              exit 0
            fi
            sleep 5
          done
          echo "Grafana failed to come up within 5 minutes" >&2
          exit 1

      - name: Assert disabled slots are absent
        if: matrix.scenario == '3-healthy-validators'
        run: |
          set -euo pipefail
          containers="$(docker ps --format '{{.Names}}')"
          echo "Running containers:"
          echo "${containers}"
          for forbidden in c-validator-1 d-validator-1; do
            if echo "${containers}" | grep -E "(^|[^a-zA-Z0-9-])${forbidden}([^a-zA-Z0-9-]|$)"; then
              echo "::error::container matching '${forbidden}' is running but the yaml disables it"
              exit 1
            fi
          done

      - name: Seed onboarding sentinel users (warm-restart, pre-restart)
        if: matrix.scenario == 'warm-restart'
        env:
          SLOTS: a b c d
        run: |
          set -euo pipefail
          tests/acceptance/restart-survival.sh create

      - name: Warm-restart cycle (down preserves volumes, then up reuses them)
        if: matrix.scenario == 'warm-restart'
        env:
          PER_VALIDATOR_TIMEOUT: 600
          POLL_INTERVAL: 5
        run: |
          set -euo pipefail
          echo "::group::canton-localnet down (preserve volumes)"
          "${GITHUB_WORKSPACE}/canton-localnet" down
          echo "::endgroup::"

          echo "::group::canton-localnet up (warm volumes)"
          "${GITHUB_WORKSPACE}/canton-localnet" up
          echo "::endgroup::"

          for prefix in 10 11 12 13 14; do
            url="http://localhost:${prefix}975/readyz"
            echo "::group::Re-wait for ${url}"
            "${GITHUB_WORKSPACE}/canton-localnet" wait-ready \
              --url "${url}" \
              --timeout "${PER_VALIDATOR_TIMEOUT}s" \
              --interval "${POLL_INTERVAL}s"
            echo "::endgroup::"
          done

      - name: Verify onboarding clients + sentinel users survived restart (issue 65 step 5)
        if: matrix.scenario == 'warm-restart'
        env:
          SLOTS: a b c d
        run: |
          set -euo pipefail
          tests/acceptance/restart-survival.sh verify

      - name: Capture compose state on failure
        if: failure()
        run: |
          set -euo pipefail
          docker ps -a > docker-ps.txt 2>&1 || true
          timeout 60 make logs > logs.txt 2>&1 || true

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-tests-${{ matrix.scenario }}
          path: |
            docker-ps.txt
            logs.txt
            docker-ps-attempt1.txt
            logs-attempt1.txt
            canton-localnet.yaml
          if-no-files-found: warn

      - name: Tear down (CLI scenarios)
        if: always() && env.IS_OBS == 'false'
        run: |
          set -euo pipefail
          "${GITHUB_WORKSPACE}/canton-localnet" down --volumes || echo "::warning::teardown failed (non-fatal in CI; runner is ephemeral)"

      - name: Tear down (observability scenarios)
        if: always() && env.IS_OBS == 'true'
        run: |
          set -euo pipefail
          make clean || echo "::warning::teardown failed (non-fatal in CI; runner is ephemeral)"
