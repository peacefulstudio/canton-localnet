name: cli

on:
  push:
    branches: [dev]
    paths:
      - 'cli/**'
      - 'action/lib.sh'
      - 'Makefile'
      - '.github/workflows/cli.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'cli/**'
      - 'action/lib.sh'
      - 'Makefile'
      - '.github/workflows/cli.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.repository == 'peacefulstudio/canton-localnet' && (github.event_name == 'push' && '[{"name":"ubuntu-latest","runner":"ubuntu-latest"},{"name":"macos-latest","runner":"macos-latest"}]' || '[{"name":"ubuntu-latest","runner":"ubuntu-latest"}]') || (vars.CI_MATRIX_MODE == 'full' && github.event_name == 'push' && '[{"name":"hetzner","runner":["self-hosted","hetzner"]},{"name":"macos-latest","runner":"macos-latest"}]' || '[{"name":"hetzner","runner":["self-hosted","hetzner"]}]')) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26'
          cache-dependency-path: cli/go.sum

      - name: Build
        working-directory: cli
        run: |
          set -euo pipefail
          go build ./...

      - name: Test
        working-directory: cli
        run: |
          set -euo pipefail
          go test -race ./...
