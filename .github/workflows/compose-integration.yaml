#
# Consolidated integration job for the compose stack. Replaces the three
# duplicate boot-stack-and-test jobs that previously lived in cli.yml,
# go-fixture.yaml, and csharp.yml.

name: compose-integration

on:
  push:
    branches: [dev]
    paths:
      - 'compose/**'
      - 'Makefile'
      - 'cli/**'
      - 'go/fixture/**'
      - 'csharp/**'
      - '!**/*.md'
      - '.github/workflows/compose-integration.yaml'
  pull_request:
    branches: [dev]
    paths:
      - 'compose/**'
      - 'Makefile'
      - 'cli/**'
      - 'go/fixture/**'
      - 'csharp/**'
      - '!**/*.md'
      - '.github/workflows/compose-integration.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  integration:
    name: integration (compose stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AUTH_MODE: oauth2
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26'
          cache-dependency-path: cli/go.sum

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0.x'

      - name: Show docker / compose versions
        run: |
          set -euo pipefail
          docker version
          docker compose version

      - name: Build canton-localnet binary
        working-directory: cli
        run: |
          set -euo pipefail
          go build -o "${GITHUB_WORKSPACE}/canton-localnet" ./cmd/canton-localnet

      - name: Bring up LocalNet via CLI (one retry on splice bootstrap race)
        run: |
          set -euo pipefail
          # Splice's SV-validator can lose a startup race on slower runners
          # — "Ensuring decentralized synchronizer registered failed:
          # UNAVAILABLE: No active synchronizer serial found". The initial
          # bring-up is treated as setup, so one retry is allowed.
          if ! "${GITHUB_WORKSPACE}/canton-localnet" up; then
            echo "::warning::canton-localnet up failed on first attempt — capturing diagnostics, tearing down with volumes, and retrying once"
            docker ps -a > /tmp/docker-ps-attempt1.txt 2>&1 || true
            timeout 60 make logs > /tmp/logs-attempt1.txt 2>&1 || true
            "${GITHUB_WORKSPACE}/canton-localnet" down --volumes || echo "::warning::pre-retry teardown failed; second up may fail with leaked state"
            sleep 30
            "${GITHUB_WORKSPACE}/canton-localnet" up
          fi

      - name: CLI wait-ready check
        run: |
          set -euo pipefail
          "${GITHUB_WORKSPACE}/canton-localnet" wait-ready --timeout 10m --interval 5s

      - name: Extract a tiny DAR from the splice onboarding container
        id: extract-dar
        run: |
          set -euo pipefail
          mkdir -p /tmp/testdata
          container=$(docker ps --filter "name=splice-onboarding" --format '{{.Names}}' | head -n1 || true)
          if [ -z "$container" ]; then
            container=$(docker ps --filter "ancestor=digitalasset/decentralized-canton-sync-onboarding" --format '{{.Names}}' | head -n1 || true)
          fi
          if [ -z "$container" ]; then
            echo "::warning::no splice onboarding container found — DAR upload portion of the integration tests will skip"
            exit 0
          fi
          dar=$(docker exec "$container" sh -c 'find /canton/dars -type f -name "*.dar" 2>/dev/null | head -n1' || true)
          if [ -z "$dar" ]; then
            echo "::warning::no DAR files inside container $container — DAR upload portion of the integration tests will skip"
            exit 0
          fi
          docker cp "$container:$dar" /tmp/testdata/test.dar
          echo "extracted $dar"
          ls -lh /tmp/testdata/test.dar
          echo "dar_path=/tmp/testdata/test.dar" >> "$GITHUB_OUTPUT"

      - name: Go fixture integration tests
        working-directory: go/fixture
        env:
          CANTON_LOCALNET_TEST_DAR_PATH: ${{ steps.extract-dar.outputs.dar_path }}
        run: |
          set -euo pipefail
          go test -tags integration -count=1 -v ./...

      - name: C# fixture integration tests
        if: success() || failure()
        env:
          CANTON_LOCALNET_TEST_DAR_PATH: ${{ steps.extract-dar.outputs.dar_path }}
          CANTON_LOCALNET_JSON_API_URL: http://localhost:11975
          CANTON_LOCALNET_TOKEN_URL: http://localhost:8082/realms/AValidator1/protocol/openid-connect/token
          CANTON_LOCALNET_CLIENT_ID: a-validator-1-validator
          CANTON_LOCALNET_CLIENT_SECRET: AL8648b9SfdTFImq7FV56Vd0KHifHBuC
          CANTON_LOCALNET_B_VALIDATOR_1_JSON_API_URL: http://localhost:12975
          CANTON_LOCALNET_B_VALIDATOR_1_TOKEN_URL: http://localhost:8082/realms/BValidator1/protocol/openid-connect/token
          CANTON_LOCALNET_B_VALIDATOR_1_CLIENT_ID: b-validator-1-validator
          CANTON_LOCALNET_B_VALIDATOR_1_CLIENT_SECRET: 6m12QyyGl81d9nABWQXMycZdXho6ejEX
        run: |
          set -euo pipefail
          dotnet test csharp/tests/Peaceful.Canton.Localnet.Testing.Tests/Peaceful.Canton.Localnet.Testing.Tests.csproj \
            --configuration Release \
            --filter "Category=Integration" \
            --logger 'console;verbosity=detailed'

      - name: Capture compose state on failure
        if: failure()
        run: |
          set -euo pipefail
          make status > /tmp/compose-status.txt 2>&1 || true
          timeout 30 make logs > /tmp/compose-logs.txt 2>&1 || true
          docker ps -a > /tmp/docker-ps.txt 2>&1 || true

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compose-integration-diagnostics
          path: |
            /tmp/compose-status.txt
            /tmp/compose-logs.txt
            /tmp/docker-ps.txt
            /tmp/docker-ps-attempt1.txt
            /tmp/logs-attempt1.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Tear down
        if: always()
        run: |
          set -euo pipefail
          "${GITHUB_WORKSPACE}/canton-localnet" down --volumes || echo "::warning::teardown failed (non-fatal in CI; runner is ephemeral)"
