# Thin caller for the reusable .NET CI workflow in peacefulstudio/github-actions.
# Build/test logic lives there so ~10 Peaceful Studio repos can consume the same
# shape; matrix + integration filter + nupkg pack are passed in via inputs.
# The `Category=Integration` smoke that used to live alongside this job now
# runs in the consolidated .github/workflows/compose-integration.yaml workflow.

name: csharp

on:
  push:
    branches: [dev]
    paths:
      - 'csharp/**'
      - 'testdata/endpoint-discovery/**'
      - '.github/workflows/csharp.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'csharp/**'
      - 'testdata/endpoint-discovery/**'
      - '.github/workflows/csharp.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  packages: read
  pull-requests: write

jobs:
  ci:
    uses: peacefulstudio/github-actions/.github/workflows/csharp-ci.yaml@v2
    with:
      concurrency-group: csharp-ci-${{ github.ref }}
      working-directory: csharp
      os-list: ${{ github.event_name == 'push' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]' }}
      coverage-pr-comment-header: csharp-coverage
      pack: true
      pack-project: src/Peaceful.Canton.Localnet.Testing/Peaceful.Canton.Localnet.Testing.csproj

  net10-runtime-tests:
    name: tests on the .NET 10 runtime
    if: github.repository == 'peacefulstudio/canton-localnet' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup the .NET 11 SDK and the .NET 10 runtime
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
          global-json-file: csharp/global.json
      - name: Test the net10.0 target on the .NET 10 runtime
        working-directory: csharp
        run: |
          set -euo pipefail
          dotnet --list-runtimes
          dotnet test --configuration Release --framework net10.0

  net10-sdk-consumer:
    name: consumer build with only the .NET 10 SDK
    needs: ci
    if: github.repository == 'peacefulstudio/canton-localnet' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Download the packed package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nupkg
          path: ${{ runner.temp }}/feed
      - name: Setup the .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Assert the package carries net10.0 and net11.0
        run: |
          set -euo pipefail
          package="$(ls "${RUNNER_TEMP}"/feed/Peaceful.Canton.Localnet.Testing.*.nupkg)"
          unzip -l "${package}" | grep -F 'lib/net10.0/Peaceful.Canton.Localnet.Testing.dll'
          unzip -l "${package}" | grep -F 'lib/net11.0/Peaceful.Canton.Localnet.Testing.dll'
      - name: Restore, build and run a net10.0 consumer of the packed package
        run: |
          set -euo pipefail
          consumer="${RUNNER_TEMP}/consumer"
          mkdir -p "${consumer}"
          package="$(ls "${RUNNER_TEMP}"/feed/Peaceful.Canton.Localnet.Testing.*.nupkg)"
          version="$(basename "${package}" .nupkg)"
          version="${version#Peaceful.Canton.Localnet.Testing.}"
          cat >"${consumer}/global.json" <<'JSON'
          {
            "sdk": { "version": "10.0.100", "rollForward": "latestFeature" }
          }
          JSON
          cat >"${consumer}/nuget.config" <<'XML'
          <configuration>
            <packageSources>
              <clear />
              <add key="packed" value="../feed" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          XML
          cat >"${consumer}/Consumer.csproj" <<XML
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <Nullable>enable</Nullable>
              <ImplicitUsings>enable</ImplicitUsings>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Peaceful.Canton.Localnet.Testing" Version="${version}" />
            </ItemGroup>
          </Project>
          XML
          cat >"${consumer}/Program.cs" <<'CS'
          using Peaceful.Canton.Localnet.Testing;

          Console.WriteLine(string.Join(",", LocalnetFixture.KnownSlots()));
          CS
          cd "${consumer}"
          dotnet --version | grep -E '^10\.'
          dotnet restore
          dotnet build --no-restore
          dotnet run --no-build | grep -F 'a-validator-1'
