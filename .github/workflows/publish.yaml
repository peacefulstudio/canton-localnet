name: Publish NuGet Packages

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag, including the leading v (e.g. v0.9.0-3). The package builds from this tag.'
        required: true
        type: string
      nuget_version:
        description: 'NuGet spelling of the release version, as resolved by release.yml (e.g. 0.9.0.3).'
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-nuget
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'peacefulstudio/canton-localnet'
    runs-on: ubuntu-latest
    environment: nuget-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: NuGet login (OIDC -> short-lived key)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Build, test, pack & push
        uses: peacefulstudio/github-actions/.github/actions/csharp-publish@v2
        with:
          api-key: ${{ steps.login.outputs.NUGET_API_KEY }}
          version_override: ${{ inputs.nuget_version }}
          working-directory: csharp
