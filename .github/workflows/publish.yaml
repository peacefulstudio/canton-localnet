name: Publish NuGet Packages

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag, including the leading v (e.g. v0.9.0-3). The push scripts are read from this tag.'
        required: true
        type: string
      nuget_version:
        description: 'NuGet spelling of the release version, as resolved by release.yml (e.g. 0.9.0.3).'
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-nuget
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'peacefulstudio/canton-localnet'
    runs-on: ubuntu-latest
    environment: nuget-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.tag }}
      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0.x'
      - name: Download the packages built, tested and packed by release.yml
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-packages
          path: nuget-packages
      - name: NuGet login (OIDC -> short-lived key)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push the packages to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          NUGET_VERSION: ${{ inputs.nuget_version }}
        run: .github/scripts/push-nuget-packages.sh nuget-packages "${NUGET_VERSION}"
