name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (no leading v, e.g. 0.9.0-3). Every job builds from the existing tag v<version>.'
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resolve:
    if: github.repository == 'peacefulstudio/canton-localnet'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      nuget: ${{ steps.resolve.outputs.nuget }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}
      - name: Resolve the release and check it against the committed version
        id: resolve
        env:
          REQUESTED: ${{ inputs.version || github.ref_name }}
        run: .github/scripts/resolve-release.sh "${REQUESTED}"

  draft:
    needs: resolve
    permissions:
      contents: write
    uses: ./.github/workflows/_release-lifecycle.yaml
    with:
      action: bootstrap
      tag: ${{ needs.resolve.outputs.tag }}

  pack-nuget:
    name: build, test and pack NuGet
    needs: [resolve, draft]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PACKAGE_ID: Peaceful.Canton.Localnet.Testing
      NUGET_VERSION: ${{ needs.resolve.outputs.nuget }}
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - name: Refuse a version nuget.org already holds
        run: .github/scripts/assert-nuget-unpublished.sh "${NUGET_VERSION}" "${PACKAGE_ID}"
      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        working-directory: csharp
        run: dotnet restore
      - name: Build
        working-directory: csharp
        run: dotnet build --configuration Release --no-restore -p:Version="${NUGET_VERSION}" -p:ContinuousIntegrationBuild=true
      - name: Test
        working-directory: csharp
        run: dotnet test --configuration Release --no-build
      - name: Pack the nuget.org package
        working-directory: csharp
        run: |
          set -euo pipefail
          dotnet pack "src/${PACKAGE_ID}/${PACKAGE_ID}.csproj" \
            --configuration Release \
            --no-build \
            -p:PackageVersion="${NUGET_VERSION}" \
            -o "${GITHUB_WORKSPACE}/nuget-packages"
          ls -la "${GITHUB_WORKSPACE}/nuget-packages"
      - name: Pack the release-asset package with the tag spelling
        working-directory: csharp
        run: |
          set -euo pipefail
          dotnet pack "src/${PACKAGE_ID}/${PACKAGE_ID}.csproj" \
            --configuration Release \
            --no-restore \
            -p:PackageVersion="${VERSION}" \
            -o "${GITHUB_WORKSPACE}/nupkgs"
          ls -la "${GITHUB_WORKSPACE}/nupkgs"
      - name: Upload the nuget.org packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-packages
          path: |
            nuget-packages/*.nupkg
            nuget-packages/*.snupkg
          if-no-files-found: error
      - name: Upload the release-asset nupkg
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkgs
          path: nupkgs/*.nupkg
          if-no-files-found: error

  cli:
    name: build CLI (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [resolve, draft]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
          - goos: darwin
            goarch: amd64
            ext: ''
          - goos: darwin
            goarch: arm64
            ext: ''
          - goos: windows
            goarch: amd64
            ext: '.exe'
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26'
          cache-dependency-path: cli/go.sum
      - name: Build
        working-directory: cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
          CGO_ENABLED: '0'
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          out="${GITHUB_WORKSPACE}/dist/canton-localnet-${VERSION}-${GOOS}-${GOARCH}${EXT}"
          mkdir -p "$(dirname "${out}")"
          go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "${out}" \
            ./cmd/canton-localnet
          ls -la "${out}"
      - name: Upload binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish-oci:
    name: push OCI compose artifact
    needs: [resolve, pack-nuget, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - name: Setup oras
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: 1.2.0
      - name: Login to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GITHUB_TOKEN}" | oras login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - name: Push compose/ to GHCR via oras
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_FULL: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          owner_lc="$(echo "${REPO_OWNER}" | tr '[:upper:]' '[:lower:]')"
          ref="ghcr.io/${owner_lc}/canton-localnet:${VERSION}"
          cd compose
          oras push "${ref}" \
            --artifact-type application/vnd.peacefulstudio.canton-localnet.compose.v1+tar \
            --annotation "org.opencontainers.image.source=https://github.com/${REPO_FULL}" \
            --annotation "org.opencontainers.image.version=${VERSION}" \
            --annotation "org.opencontainers.image.revision=${REVISION}" \
            --annotation "org.opencontainers.image.licenses=Apache-2.0" \
            .
          echo "Pushed ${ref}"

  publish-nuget:
    needs: [resolve, publish-oci, attach-assets]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish.yaml
    secrets: inherit
    with:
      tag: ${{ needs.resolve.outputs.tag }}
      nuget_version: ${{ needs.resolve.outputs.nuget }}

  attach-assets:
    name: attach assets to the draft
    needs: [resolve, pack-nuget, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download CLI binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - name: Download nupkg
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nupkgs
          path: dist
      - name: Generate checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum ./* > checksums.txt
          cat checksums.txt
      - name: Upload assets to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: gh release upload "${TAG}" dist/* --clobber

  publish-release:
    needs: [resolve, publish-nuget]
    permissions:
      contents: write
    uses: ./.github/workflows/_release-lifecycle.yaml
    with:
      action: finalize
      tag: ${{ needs.resolve.outputs.tag }}
      prerelease: ${{ needs.resolve.outputs.prerelease }}
