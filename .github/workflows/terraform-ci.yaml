name: terraform-ci

on:
  push:
    branches: [dev]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-ci.yaml'
  pull_request:
    branches: [dev]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-ci.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hetzner:
    uses: peacefulstudio/github-actions/.github/workflows/terraform-ci.yaml@v1
    with:
      working-directory: terraform/hetzner
      pr-comment-header: terraform-tests-hetzner
      coverage-title: Terraform coverage (hetzner)
    permissions:
      contents: read
      pull-requests: write

  github-oidc:
    uses: peacefulstudio/github-actions/.github/workflows/terraform-ci.yaml@v1
    with:
      working-directory: terraform/github-oidc
      pr-comment-header: terraform-tests-github-oidc
      coverage-title: Terraform coverage (github-oidc)
    permissions:
      contents: read
      pull-requests: write
